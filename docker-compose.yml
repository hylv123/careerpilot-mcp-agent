# 启动：docker compose up -d ｜ 日志：docker compose logs -f [api|worker] ｜ 停止：docker compose down

# api 与 worker 共用同一镜像，只有启动命令不同
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  image: careerpilot-mcp-agent:0.1.0

  # 启动时注入，不写进镜像层；写进镜像等于把密钥交给任何拿到镜像的人
  env_file:
    - .env

  environment:
    TZ: Asia/Shanghai
    CAREERPILOT_DB_PATH: /app/data/jobs.db
    CAREERPILOT_OUTPUT_DIR: /app/output
    FORCE_REBUILD_INDEX: "0"
    REDIS_URL: redis://redis:6379/0

  # 只写 depends_on 只保证容器起来了，不保证 Redis 能应答
  depends_on:
    redis:
      condition: service_healthy

  # 用具名卷而不是挂宿主机目录：容器内是 uid 10001，宿主机目录属主对不上会 Permission denied
  volumes:
    - careerpilot-data:/app/data
    - careerpilot-output:/app/output
    - careerpilot-logs:/app/logs
    - careerpilot-index:/app/knowledge/index

  restart: unless-stopped

services:
  api:
    <<: *app-common
    container_name: careerpilot-api
    command:
      - uvicorn
      - api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *app-common
    # 不设 container_name：固定名字会导致 --scale worker=3 名字冲突
    command: ["python", "-m", "tasks.worker"]

    # 还要等 api 健康：entrypoint 会在索引缺失时自动构建，
    # 两边同时冷启动会各建一次索引，既费 embedding 费用也可能互相覆盖
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

    # worker 没有 HTTP 接口，只能检查 PID 1 还是 worker 进程；
    # 这条规则发现不了"卡死但不退出"，那种情况靠 reclaim_stale 兜底
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'tasks.worker' in open('/proc/1/cmdline').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 这里是任务队列不是缓存，所以不开持久化、内存满时拒绝写入而不是淘汰
  redis:
    image: redis:7-alpine
    container_name: careerpilot-redis
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "noeviction"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  careerpilot-data:
  careerpilot-output:
  careerpilot-logs:
  careerpilot-index:
